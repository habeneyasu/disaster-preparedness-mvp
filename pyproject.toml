[project]
name = "disaster-preparedness-mvp"
version = "0.1.0"
description = "Disaster preparedness MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "starlette>=0.46.0,<1.0.0",
    "uvicorn[standard]>=0.32,<1",
    "pydantic==2.7.2",
    "transformers==4.41.2",
    "torch==2.3.1",
    "scikit-learn==1.5.0",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "folium==0.16.0",
    "gradio==4.44.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
